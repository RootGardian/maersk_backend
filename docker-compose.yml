version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maersk_backend
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    # Commande pour exécuter les migrations Prisma avant de démarrer
    command: sh -c "npx prisma migrate deploy && npm start"

  db:
    image: postgres:15-alpine
    container_name: maersk_db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maersk_user -d maersk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../maersk_frontend/frontend
      dockerfile: Dockerfile
      args:
        # L'URL de l'API que le frontend utilisera pour discuter avec le backend (à adapter avec l'IP/Domaine)
        - VITE_API_URL=http://localhost:5000
    container_name: maersk_frontend
    restart: unless-stopped
    ports:
      - "80:80"

  nginx:
    image: nginx:alpine
    container_name: maersk_nginx
    restart: unless-stopped
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
