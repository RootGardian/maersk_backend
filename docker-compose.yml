version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maersk_backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://maersk_user:maersk_password@db:5432/maersk_db
      - PEPPER=maersk-sqjrgvhloqebvv-bkfsdçnàndsb_bsjbfdibs
      - JWT_SECRET=maersk-idfgjsihfgvsçnnsis_bjsudvjfsbvihv
      - ADMIN_EMAIL=mariejosephine1.gomez@maersk.com
      - ADMIN_PASSWORD=M@rie.Joe@2@26
    depends_on:
      db:
        condition: service_healthy
    # Commande pour exécuter les migrations Prisma avant de démarrer
    command: sh -c "npx prisma migrate deploy && npm start"

  db:
    image: postgres:15-alpine
    container_name: maersk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: maersk_user
      POSTGRES_PASSWORD: maersk_password
      POSTGRES_DB: maersk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maersk_user -d maersk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: maersk_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
